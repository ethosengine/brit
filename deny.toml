    { id = "RUSTSEC-2026-0582", reason = "`gix-hash` pulls in `faster-hex` 0.10.1, which requires `heapless` ^0.8 and uses only `heapless::String` and `heapless::Vec<u8>`; remove when the affected `gix-hash` versions move to a release using `heapless` >= 0.9.4" },
