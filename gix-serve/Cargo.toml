lints.workspace = true

[package]
name = "gix-serve"
version = "0.1.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project for serving git repositories"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2021"
include = ["src/**/*", "LICENSE-*"]
rust-version = "1.82"

[lib]
doctest = false

[features]
## Enable support for SHA-1 hashes.
sha1 = ["gix-hash/sha1"]
## Blocking server support.
blocking-server = [
  "gix-protocol/blocking-server",
  "gix-transport/blocking-server",
]

[dependencies]
gix-ref = { version = "^0.69.0", path = "../gix-ref", registry = "elohim" }
gix-hash = { version = "^0.28.0", path = "../gix-hash", registry = "elohim" }
gix-pack = { version = "^0.76.0", path = "../gix-pack", registry = "elohim", features = [
  "generate",
] }
gix-features = { version = "^0.48.1", path = "../gix-features", registry = "elohim" }
gix-protocol = { version = "^0.67.0", path = "../gix-protocol", registry = "elohim", optional = true }
gix-transport = { version = "^0.61.0", path = "../gix-transport", registry = "elohim", optional = true }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
thiserror = "2.0.18"

[dev-dependencies]
gix-testtools = { path = "../tests/tools" }
gix-odb = { version = "^0.86.0", path = "../gix-odb", registry = "elohim" }
gix-packetline = { version = "^0.24.0", path = "../gix-packetline", registry = "elohim", features = [
  "blocking-io",
] }
gix-transport = { version = "^0.61.0", path = "../gix-transport", registry = "elohim", features = [
  "blocking-server",
] }
gix-serve = { path = ".", features = ["blocking-server"] }

[package.metadata.docs.rs]
all-features = true
