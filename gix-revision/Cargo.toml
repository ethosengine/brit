lints.workspace = true

[package]
name = "gix-revision"
version = "0.49.1"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing with finding names for revisions and parsing specifications"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*", "/README.md"]
rust-version = "1.88"

[lib]
doctest = false

[features]
default = ["describe", "merge_base"]
## Enable support for the SHA-1 hash by enabling the respective feature in the `gix-hash` crate.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `gix-hash` crate.
sha256 = ["gix-hash/sha256"]

## `git describe` functionality
describe = ["dep:gix-trace", "dep:gix-hashtable"]

## `git merge-base` functionality
merge_base = ["dep:gix-trace", "dep:bitflags"]

## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "gix-hash/serde", "gix-object/serde"]

[dependencies]
gix-error = { version = "^0.3.2", path = "../gix-error", registry = "elohim" }
gix-hash = { version = "^0.26.3", path = "../gix-hash", registry = "elohim" }
gix-object = { version = "^0.64.2", path = "../gix-object", registry = "elohim" }
gix-date = { version = "^0.16.0", path = "../gix-date", registry = "elohim" }
gix-hashtable = { version = "^0.16.1", path = "../gix-hashtable", registry = "elohim", optional = true }
gix-revwalk = { version = "^0.35.0", path = "../gix-revwalk", registry = "elohim" }
gix-commitgraph = { version = "^0.39.0", path = "../gix-commitgraph", registry = "elohim" }
gix-trace = { version = "^0.1.21", path = "../gix-trace", registry = "elohim", optional = true }

bstr = { version = "1.12.0", default-features = false, features = ["std"] }
bitflags = { version = "2", optional = true }
nonempty = "0.12.0"
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }
document-features = { version = "0.2.1", optional = true }

[dev-dependencies]
insta = "1.46.3"
gix-odb = { path = "../gix-odb", features = ["sha1", "sha256"] }
gix-testtools = { path = "../tests/tools" }
permutohedron = "0.2.4"

[package.metadata.docs.rs]
all-features = true
features = ["sha1", "document-features"]
