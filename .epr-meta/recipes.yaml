version: 1
recipes:
  - id: brit-native-developer
    version: 1
    description: Feature intent through independently reviewed habit delivery.
    stages:
      - name: spec
        artifactKind: doc:spec
        paths: ["docs/parity/capability-boundaries.md"]
      - name: plan
        artifactKind: doc:plan
        paths:
          - "docs/plans/2026-09-28-governed-readiness.md"
          - "docs/plans/2026-09-28-inherited-ci.md"
          - "docs/plans/2026-09-28-daily-driver.md"
          - "docs/plans/2026-09-28-git-compatibility.md"
          - "docs/plans/2026-09-28-git-feature-census.md"
          - "docs/plans/2026-09-28-git-atomic-census.md"
          - "docs/plans/2026-09-28-parity-evidence-reconciliation.md"
      - name: intent
        artifactKind: gap-item
        paths: [".eprfs/status/gap-items/*.json"]
    edges:
      - {from: spec, to: plan, meaningful: true, validators: []}
      - {from: plan, to: intent, meaningful: true, validators: [decompose]}
