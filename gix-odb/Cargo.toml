lints.workspace = true

[package]
name = "gix-odb"
version = "0.86.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Implements various git object databases"
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"
autotests = false

[lib]
doctest = true

[features]
## Enable support for the SHA-1 hash by enabling the respective feature in the `gix-hash` crate.
sha1 = ["gix-hash/sha1", "gix-pack/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `gix-hash` crate.
sha256 = ["gix-hash/sha256", "gix-pack/sha256"]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "gix-hash/serde", "gix-object/serde", "gix-pack/serde"]

[dependencies]
crc32fast = "1.5.0"
gix-trace = { version = "^0.3.0", path = "../gix-trace", registry = "elohim" }
gix-utils = { version = "^0.5.1", path = "../gix-utils", registry = "elohim", features = ["progress"] }
gix-parallel = { version = "^0.50.0", path = "../gix-parallel", registry = "elohim" }
gix-error = { version = "^0.5.1", path = "../gix-error", registry = "elohim" }
gix-zlib = { version = "^0.3.0", path = "../gix-zlib", registry = "elohim" }
gix-hashtable = { version = "^0.18.0", path = "../gix-hashtable", registry = "elohim" }
gix-hash = { version = "^0.28.0", path = "../gix-hash", registry = "elohim" }
gix-path = { version = "^0.14.0", path = "../gix-path", registry = "elohim" }
gix-quote = { version = "^0.10.0", path = "../gix-quote", registry = "elohim" }
gix-object = { version = "^0.66.0", path = "../gix-object", registry = "elohim" }
gix-pack = { version = "^0.76.0", path = "../gix-pack", registry = "elohim", default-features = false }
gix-fs = { version = "^0.24.0", path = "../gix-fs", registry = "elohim", features = ["walkdir"] }
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }

tempfile = "3.26.0"
parking_lot = { version = "0.12.4" }
arc-swap = "1.9.0"
memmap2 = "0.9.11"

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
insta = "1.46.3"
gix-odb = { path = ".", features = ["sha1", "sha256"] }
gix-hash = { path = "../gix-hash" }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }
gix-date = { path = "../gix-date" }
gix-pack = { path = "../gix-pack", features = ["sha1"] }
gix-actor = { path = "../gix-actor" }
pretty_assertions = "1.0.0"
filetime = "0.2.29"
maplit = "1.0.2"
crossbeam-channel = "0.5.15"

[[test]]
name = "odb"
path = "tests/odb/main.rs"

[[test]]
name = "threaded"
path = "tests/threaded.rs"
required-features = ["gix-parallel/parallel"]

[package.metadata.docs.rs]
features = ["sha1", "document-features", "serde"]
