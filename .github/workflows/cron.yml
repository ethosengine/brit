name: cron

on:
  schedule:
    - cron: '0 13,1 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # brit-cli depends on rakia-* from the `elohim` Nexus registry, which
  # advertises auth-required — without a credential cargo cannot even resolve
  # the workspace, so `make stress` dies building release-lean. Same read
  # token and provider as ci.yml.
  CARGO_REGISTRIES_ELOHIM_TOKEN: ${{ secrets.CARGO_REGISTRIES_ELOHIM_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

jobs:
  stress:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: stress
        run: make stress
