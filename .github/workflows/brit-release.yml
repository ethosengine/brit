# Brit's fork-owned one-binary release. The inherited release.yml remains the
# upstream gitoxide workflow and is guarded off on ethosengine/brit.
name: brit release

on:
  push:
    tags:
      - 'brit-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_REGISTRIES_ELOHIM_INDEX: sparse+https://nexus.ethosengine.com/repository/cargo-internal/
  CARGO_REGISTRIES_ELOHIM_TOKEN: ${{ secrets.CARGO_REGISTRIES_ELOHIM_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RUSTFLAGS: ''
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version_tag: ${{ steps.source.outputs.version_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set an external Cargo target for source tests
        run: printf 'CARGO_TARGET_DIR=%s/brit-release-test-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Validate the Brit tag and source checkout
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/brit-v*) ;;
            *) echo "Brit releases require a brit-v* tag ref" >&2; exit 2 ;;
          esac
          version=$(awk '/^\[package\]/{inside=1; next} inside && /^version[[:space:]]*=/{gsub(/[" ]/, "", $3); print $3; exit}' brit-cli/Cargo.toml)
          test -n "$version"
          test "$RELEASE_TAG" = "brit-v$version"
          source_sha=$(git rev-parse HEAD)
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$source_sha"
          test -z "$(git status --porcelain --untracked-files=normal)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "version_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Test the exact source before creating a release
        run: |
          set -euo pipefail
          cargo test --locked -p brit-cli --no-default-features --features max-pure
          cargo build --locked -p brit-cli --bin brit --no-default-features --features max-pure
          BRIT_BIN="$CARGO_TARGET_DIR/debug/brit" cargo test --locked -p cli-journey \
            --test brit --test rakia --test inherited_git_environment --test shared_tree
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Create a draft release after source tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.source.outputs.version_tag }}
        run: gh release create "$VERSION_TAG" --title "$VERSION_TAG" --draft --verify-tag

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      RUSTFLAGS: ''
      FEATURE: max-pure
      PROFILE: release-github
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set an external Cargo target for this host
        run: printf 'CARGO_TARGET_DIR=%s/brit-release-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify this job received the validated source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Install the target toolchain
        run: |
          rustup update stable
          rustup target add "$TARGET"
      - name: Build exactly the Brit executable
        run: |
          set -euo pipefail
          cargo build --locked -p brit-cli --bin brit --profile "$PROFILE" \
            --target "$TARGET" --no-default-features --features "$FEATURE"
      - name: Smoke the built executable on its host
        run: |
          set -euo pipefail
          build_root=$CARGO_TARGET_DIR
          if [ "$RUNNER_OS" = Windows ]; then build_root=$(cygpath -u "$CARGO_TARGET_DIR"); fi
          case "$TARGET" in *-windows-*) binary=brit.exe ;; *) binary=brit ;; esac
          binary_path="$build_root/$TARGET/$PROFILE/$binary"
          "$binary_path" --help >/dev/null
          "$binary_path" build --help >/dev/null
          "$binary_path" --version
      - name: Package one binary, receipt, and checksum
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=all)"
          build_root=$CARGO_TARGET_DIR
          if [ "$RUNNER_OS" = Windows ]; then build_root=$(cygpath -u "$CARGO_TARGET_DIR"); fi
          case "$TARGET" in *-windows-*) binary=brit.exe ;; *) binary=brit ;; esac
          archive="brit-$FEATURE-${VERSION_TAG#brit-}-$TARGET"
          bash scripts/ci/package-brit-release.sh \
            "$build_root/$TARGET/$PROFILE/$binary" . "$archive" \
            "$VERSION_TAG" "$FEATURE" "$TARGET" "$PROFILE" "$SOURCE_SHA" \
            >> "$GITHUB_ENV"
      - name: Upload the checksummed archive to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION_TAG" "$ASSET" "$ASSET_SUM"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify all four release archives
        run: |
          set -euo pipefail
          gh release download "$VERSION_TAG" --pattern 'brit-*.sha256'
          gh release download "$VERSION_TAG" --pattern 'brit-*.tar.gz' --pattern 'brit-*.zip'
          count=$(find . -maxdepth 1 -name 'brit-*.sha256' -type f | wc -l)
          test "$count" -eq 4
          for sum in brit-*.sha256; do sha256sum -c "$sum"; done
          cat brit-*.sha256 > hashes.sha256
          gh release upload "$VERSION_TAG" hashes.sha256
      - name: Publish only after every target succeeded
        if: vars.DRY_RUN_RELEASE != 'true' && vars.DRY_RUN_RELEASE != 'yes' && vars.DRY_RUN_RELEASE != '1'
        run: gh release edit "$VERSION_TAG" --draft=false
