# Brit's fork-owned one-binary release. The inherited release.yml remains the
# upstream gitoxide workflow and is guarded off on ethosengine/brit.
name: brit release

on:
  push:
    tags:
      - 'brit-v*'
  # Manual branch runs qualify installable candidates; only tag pushes publish.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_REGISTRIES_ELOHIM_INDEX: sparse+https://nexus.ethosengine.com/repository/cargo-internal/
  CARGO_REGISTRIES_ELOHIM_TOKEN: ${{ secrets.CARGO_REGISTRIES_ELOHIM_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ''
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version_tag: ${{ steps.source.outputs.version_tag }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set an external Cargo target for source tests
        run: printf 'CARGO_TARGET_DIR=%s/brit-release-test-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Validate the Brit tag and source checkout
        id: source
        env:
          DELIVERY_EVENT: ${{ github.event_name }}
          DELIVERY_REF: ${{ github.ref }}
          DELIVERY_SHA: ${{ github.sha }}
        run: |
          bash scripts/ci/validate-brit-delivery-source.sh . "$DELIVERY_EVENT" "$DELIVERY_REF" "$DELIVERY_SHA" >> "$GITHUB_OUTPUT"
      - name: Test the exact source before creating a release
        run: |
          set -euo pipefail
          cargo test --locked -p brit-cli --no-default-features --features max-pure
          cargo build --locked -p brit-cli --bin brit --no-default-features --features max-pure
          BRIT_BIN="$CARGO_TARGET_DIR/debug/brit" cargo test --locked -p cli-journey \
            --test brit --test rakia --test inherited_git_environment --test shared_tree \
            --test authoring --test pre_push --test commit_cleanup --test daily_driver
          test -z "$(git status --porcelain --untracked-files=all)"

  build:
    name: installed delivery (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ''
      FEATURE: max-pure
      PROFILE: release-github
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set an external Cargo target for this host
        run: printf 'CARGO_TARGET_DIR=%s/brit-release-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify this job received the validated source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Install the target toolchain
        run: |
          rustup update stable
          rustup target add "$TARGET"
      - name: Build exactly the Brit executable
        run: |
          set -euo pipefail
          cargo build --locked -p brit-cli --bin brit --profile "$PROFILE" \
            --target "$TARGET" --no-default-features --features "$FEATURE"
      - name: Smoke the built executable on its host
        run: |
          set -euo pipefail
          build_root=$CARGO_TARGET_DIR
          if [ "$RUNNER_OS" = Windows ]; then build_root=$(cygpath -u "$CARGO_TARGET_DIR"); fi
          case "$TARGET" in *-windows-*) binary=brit.exe ;; *) binary=brit ;; esac
          binary_path="$build_root/$TARGET/$PROFILE/$binary"
          "$binary_path" --help >/dev/null
          "$binary_path" build --help >/dev/null
          "$binary_path" --version
      - name: Package one binary, receipt, and checksum
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=all)"
          build_root=$CARGO_TARGET_DIR
          if [ "$RUNNER_OS" = Windows ]; then build_root=$(cygpath -u "$CARGO_TARGET_DIR"); fi
          case "$TARGET" in *-windows-*) binary=brit.exe ;; *) binary=brit ;; esac
          archive="brit-$FEATURE-${VERSION_TAG#brit-}-$TARGET"
          bash scripts/ci/package-brit-release.sh \
            "$build_root/$TARGET/$PROFILE/$binary" . "$archive" \
            "$VERSION_TAG" "$FEATURE" "$TARGET" "$PROFILE" "$SOURCE_SHA" \
            >> "$GITHUB_ENV"
      - name: Qualify extracted Unix installation and operational journeys
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          binary_sha=$(awk -F= '$1 == "binary_sha256" { print $2 }' "${ASSET%.tar.gz}/BUILD-INFO.txt")
          isolated="$RUNNER_TEMP/brit-installed-qualification"
          mkdir -p "$isolated/extracted"
          shasum -a 256 -c "$ASSET_SUM"
          tar -xzf "$ASSET" -C "$isolated/extracted"
          package="$isolated/extracted/${ASSET%.tar.gz}"
          bash scripts/ci/install-brit-release.sh "$package" "$isolated/install" "$SOURCE_SHA" "$binary_sha"
      - name: Prove source-free installed authoring and recovery
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          installed="$RUNNER_TEMP/brit-installed-qualification/install/bin/brit"
          bash scripts/ci/verify-installed-brit.sh "$installed"
          BRIT_BIN="$installed" cargo test --locked -p cli-journey \
            --test authoring --test pre_push --test commit_cleanup --test daily_driver --test shared_tree
      - name: Prove Unix installer interruption and rollback mechanics
        if: runner.os != 'Windows'
        run: |
          bash scripts/ci/test-install-brit-release.sh
          bash scripts/ci/test-install-brit-epr.sh
      - name: Retain checksummed delivery candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brit-delivery-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SUM }}
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/brit-v') && needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify all four release archives
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            gh run download "$GITHUB_RUN_ID" --name "brit-delivery-$SOURCE_SHA-$GITHUB_RUN_ATTEMPT-$target" --dir .
          done
          count=$(find . -maxdepth 1 -name 'brit-*.sha256' -type f | wc -l)
          test "$count" -eq 4
          for sum in brit-*.sha256; do sha256sum -c "$sum"; done
          cat brit-*.sha256 > hashes.sha256
      - name: Create draft with all verified archives
        run: |
          gh release create "$VERSION_TAG" --title "$VERSION_TAG" --draft --verify-tag \
            brit-*.tar.gz brit-*.zip brit-*.sha256 hashes.sha256
      - name: Publish only after every target succeeded
        if: vars.DRY_RUN_RELEASE != 'true' && vars.DRY_RUN_RELEASE != 'yes' && vars.DRY_RUN_RELEASE != '1'
        run: gh release edit "$VERSION_TAG" --draft=false
