name: ci

on:
  push:
    branches:
      - main
      - "run-ci/**"
      - "**/run-ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Keep every landed commit's exhaustive run, while cancelling obsolete PR runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CLICOLOR: "1"
  # Ubuntu compiler defaults can exceed v2. Scope the C floor to this target,
  # preserving the ARM, i386, Windows and WASM members of the inherited matrix.
  CFLAGS_x86_64_unknown_linux_gnu: '-march=x86-64-v2'
  # Read-only credential for the internal Nexus cargo registry. `cargo-internal`
  # is a hosted repo: Nexus serves its content to anonymous clients (verified),
  # but config.json advertises auth-required:true and the cargo *client* refuses
  # to fetch without a credential — and hosted cargo repos have no
  # requireAuthentication knob to turn that off (Nexus 3.89). So we hand cargo a
  # least-privilege Basic-auth token (cargo-ci user; repository-view read+browse
  # on cargo-internal only) to resolve elohim-epr and the rakia crates. cargo
  # sends it verbatim as the Authorization header. The crates.io mirror (cargo
  # group) is not auth-required, so its reads stay anonymous. Publishing is
  # unaffected — it needs the separate cargo-deployer write privilege.
  # Secret value: "Basic " + base64("cargo-ci:<password>").
  # Also define the `elohim` registry by env, not only in .cargo/config.toml:
  # cargo reads config from the *current directory*, and journey tests run
  # `cargo run --manifest-path …/gix-tempfile/Cargo.toml` from outside the
  # repo, where the registry would otherwise be unknown.
  CARGO_REGISTRIES_ELOHIM_INDEX: sparse+https://nexus.ethosengine.com/repository/cargo-internal/
  CARGO_REGISTRIES_ELOHIM_TOKEN: ${{ secrets.CARGO_REGISTRIES_ELOHIM_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

jobs:
  # ---- Inherited gitoxide checks ------------------------------------------------------
  # `plan`, `run` and `downstream` follow upstream's ci.yml; differences are marked `Brit:`.
  # The scheduler in `tests/it/src/qa` reads each crate's `[package.metadata.qa]` and plans
  # the jobs, so a new upstream check arrives with a merge instead of a workflow edit.
  plan:
    name: Select QA work
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.contract.outputs.matrix }}
      plan: ${{ steps.contract.outputs.plan }}
      downstream: ${{ steps.contract.outputs.downstream }}
    env:
      # Brit: `rust-toolchain.toml` pins the first-party jobs. The inherited checks run on
      # stable, as upstream runs them; the scheduler selects any other toolchain itself.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR merge commits include the comparison base as a parent.
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || '1' }}
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-plan
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache dependency metadata for offline feature selection
        run: cargo fetch --locked
      - name: Test the planner without building Git tooling
        run: cargo run --profile qa --locked -p internal-tools --no-default-features --bin qa -- run --mode exhaustive --stage self-test
      - name: Select checks and distribute them across platforms
        id: plan
        env:
          QA_MODE: ${{ github.event_name == 'pull_request' && 'fast' || 'exhaustive' }}
          QA_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: cargo run --profile qa --locked -p internal-tools --no-default-features --bin qa -- plan --all-platforms --mode "$QA_MODE" --base "$QA_BASE" --github-output "$RUNNER_TEMP/qa-planned.txt"
      # Brit: `.epr-meta/readiness.json` declares each planned job required, deferred,
      # replaced by a first-party job, or disabled. An undeclared job is refused.
      - name: Apply Brit's inherited-CI contract to the planned jobs
        id: contract
        run: python3 scripts/ci/inherited_ci_policy.py --planned "$RUNNER_TEMP/qa-planned.txt" --github-output "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.id }}
    needs: plan
    if: needs.plan.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    continue-on-error: ${{ !matrix.blocking }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }} # zizmor: ignore[unpinned-images] SHA256 pins in tests/it/src/qa/catalog.rs.
    permissions:
      contents: read # Required to check out the repository.
      actions: read # Required to find and download the base commit's coverage artifacts.
    env:
      QA_PLAN: ${{ needs.plan.outputs.plan }}
      QA_JOB: ${{ matrix.id }}
      # Brit: see the plan job. Tasks that need another toolchain name it themselves.
      RUSTUP_TOOLCHAIN: stable
      # Main provides reusable indexes; PR cache misses run ordinary QA without collecting throwaway data.
      # Brit: coverage-guided selection is opt-in through the repository variable QA_COVERAGE (on or shadow).
      GIX_QA_COVERAGE: ${{ (vars.QA_COVERAGE == 'on' || vars.QA_COVERAGE == 'shadow') && (contains(matrix.tasks, 'native-tests') || contains(matrix.tasks, 'isolated-tests') || contains(matrix.tasks, 'feature-tests')) && (github.event_name == 'pull_request' && (vars.QA_COVERAGE == 'shadow' && 'shadow' || 'prune') || github.ref == 'refs/heads/main' && 'collect') || 'off' }}
    steps:
      # Native 32-bit containers need libraries for the runner's 64-bit Node.js.
      - name: Install container prerequisites
        if: matrix.container != ''
        shell: bash
        env:
          RUNNER_ARCHITECTURE: ${{ matrix.runner_architecture }}
        run: |
          prerequisites=(
            build-essential
            ca-certificates
            cmake
            curl
            git
            jq
            libssl-dev
            "libstdc++6:$RUNNER_ARCHITECTURE"
            pkgconf
            python3-minimal
            # Brit: commit-signature journeys need ssh-keygen, terminal recovery tests need
            # the standard-library pty module, and bounded-checkout probes use GNU time.
            openssh-client
            python3
            time
          )
          dpkg --add-architecture "$RUNNER_ARCHITECTURE"
          apt-get update
          apt-get install --no-install-recommends -y -- "${prerequisites[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Automatic coverage compares with the base parent of GitHub's PR merge commit.
          fetch-depth: ${{ matrix.history && '0' || github.event_name == 'pull_request' && '2' || '1' }}
      # Brit: the workspace's test build and its fixture snapshots outgrow the hosted disk.
      - name: Make room for the native test build
        if: runner.os == 'Linux' && matrix.container == '' && matrix.freebsd_release == ''
        shell: bash
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # Brit: attribution probes time child processes with GNU tools on macOS.
      - name: Install the attribution timer on macOS
        if: runner.os == 'macOS'
        run: brew install coreutils
      - name: Install native Rust
        if: matrix.container == '' && matrix.freebsd_release == ''
        shell: bash
        run: |
          rustup update stable
          rustup default stable
      - name: Install container Rust
        if: matrix.container != ''
        shell: bash
        env:
          HOST_TRIPLE: ${{ matrix.host }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --default-host "$HOST_TRIPLE" --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install additional Rust toolchains
        if: join(matrix.rust_toolchains, ' ') != ''
        shell: bash
        env:
          RUST_TOOLCHAINS: ${{ join(matrix.rust_toolchains, ' ') }}
        run: |
          read -r -a toolchains <<< "$RUST_TOOLCHAINS"
          for toolchain in "${toolchains[@]}"; do
            if [[ "$toolchain" != stable ]]; then
              rustup toolchain install "$toolchain" --profile minimal --no-self-update
            fi
          done
      - name: Install Rust components
        if: toJSON(matrix.rust_components) != '[]'
        shell: bash
        env:
          RUST_COMPONENTS: ${{ toJSON(matrix.rust_components) }}
        run: |
          jq -r '.[] | [.toolchain, .component] | @tsv' <<< "$RUST_COMPONENTS" | tr -d '\r' |
            while IFS=$'\t' read -r toolchain component; do
              rustup component add --toolchain "$toolchain" "$component"
            done
      - name: Install Rust targets
        if: toJSON(matrix.rust_targets) != '[]'
        shell: bash
        env:
          RUST_TARGETS: ${{ toJSON(matrix.rust_targets) }}
        run: |
          jq -r '.[] | [.toolchain, .target] | @tsv' <<< "$RUST_TARGETS" | tr -d '\r' |
            while IFS=$'\t' read -r toolchain target; do
              rustup target add --toolchain "$toolchain" "$target"
            done
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        if: matrix.just
        with:
          tool: just@${{ matrix.just_version }} # zizmor: ignore[unpinned-tools] Exact version in Cargo.toml's workspace.metadata.qa.tool-versions.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.freebsd_release == ''
        with:
          shared-key: ${{ matrix.cache || matrix.id }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the selected Rust tools
        if: join(matrix.tools, ',') != ''
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: ${{ join(matrix.tools, ',') }}
      - name: Install archive test dependencies
        if: matrix.xz && runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends liblzma-dev
      - name: Install cargo diet
        if: matrix.diet
        shell: bash
        env:
          CARGO_DIET_TAG: v${{ matrix.diet_version }}
        run: |
          curl -LSfs "https://raw.githubusercontent.com/the-lean-crate/cargo-diet/refs/tags/$CARGO_DIET_TAG/ci/install.sh" |
            sh -s -- --git the-lean-crate/cargo-diet --target x86_64-unknown-linux-musl --tag "$CARGO_DIET_TAG"
      - name: Install optional coverage tools
        if: env.GIX_QA_COVERAGE == 'collect'
        continue-on-error: true
        shell: bash
        run: rustup component add llvm-tools-preview --toolchain stable
      - name: Download optional coverage indexes from the PR base
        if: env.GIX_QA_COVERAGE == 'shadow' || env.GIX_QA_COVERAGE == 'prune'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
          COVERAGE_ARTIFACT: qa-coverage-${{ matrix.id }}
        run: |
          coverage_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --commit "$COVERAGE_BASE" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$coverage_run"
          gh run download "$coverage_run" --repo "$GITHUB_REPOSITORY" --name "$COVERAGE_ARTIFACT" \
            --dir target/qa-coverage/indexes
      - name: Run the selected checks
        if: matrix.freebsd_release == ''
        # Keep Windows' native shell; the shared runner configures every task's environment.
        run: cargo run --profile qa --locked -p internal-tools --no-default-features --bin qa -- run --from-env
      - name: Run the selected checks in FreeBSD
        if: matrix.freebsd_release != ''
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: ${{ matrix.freebsd_release }}
          sync: rsync
          copyback: false
          # Brit: the virtual machine also needs the toolchain choice and the registry credential.
          envs: QA_PLAN QA_JOB CARGO_TERM_COLOR CLICOLOR CARGO_PROFILE_DEV_DEBUG CARGO_PROFILE_DEV_STRIP GIX_QA_COVERAGE RUSTUP_TOOLCHAIN CARGO_REGISTRIES_ELOHIM_INDEX CARGO_REGISTRIES_ELOHIM_TOKEN CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS
          prepare: |
            pkg install -y ca_root_nss curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --default-toolchain stable --profile minimal
          run: |
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo run --profile qa --locked -p internal-tools --no-default-features --bin qa -- run --from-env
      - name: Publish optional coverage indexes
        if: success() && env.GIX_QA_COVERAGE == 'collect'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-coverage-${{ matrix.id }}
          path: target/qa-coverage/indexes/*.json
          if-no-files-found: ignore
          retention-days: 14

  # Brit: disabled in `.epr-meta/readiness.json`, so the planner output this job waits for stays empty.
  downstream:
    name: Consumer / ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.downstream != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.downstream) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the gix version under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitoxide
          persist-credentials: false
      - name: Check out the consumer's default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          path: consumer
          persist-credentials: false
      - name: Install GitButler dependencies
        if: matrix.repository == 'gitbutlerapp/gitbutler'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Install GitButler GPUI dependencies
        if: matrix.name == 'gitbutler-gpui'
        run: sudo apt-get install -y --no-install-recommends libxcb1-dev libxkbcommon-x11-dev libfontconfig-dev
      - name: Install Zig for GitButler's terminal
        if: matrix.name == 'gitbutler-gpui'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: downstream-${{ matrix.name }}
          workspaces: |
            gitoxide -> target
            consumer -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the consumer with this gix
        working-directory: gitoxide
        env:
          QA_DOWNSTREAM_NAME: ${{ matrix.name }}
        run: cargo run --profile qa --locked -p internal-tools --no-default-features --bin qa -- downstream "$QA_DOWNSTREAM_NAME" --checkout ../consumer

  # ---- Brit's first-party checks ------------------------------------------------------
  brit-cpu-compatibility:
    # Distribution includes prebuilt CRT/loader/ABI inputs, not just our flags.
    # Keep the shipping baseline explicit; ordinary source jobs still cover latest.
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '1'
      RUSTFLAGS: '-C target-cpu=x86-64-v2'
      CFLAGS: '-march=x86-64-v2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CPU emulation and Clippy
        run: |
          printf 'CARGO_TARGET_DIR=%s/brit-cpu-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y qemu-user openssl
          bash scripts/ci/verify-cpu-matrix.sh --preflight
          rustup toolchain install 1.100.0 --profile minimal --no-self-update
          rustup component add clippy
      - name: Prove early compiler refusals
        run: bash scripts/ci/test-cpu-baseline.sh
      - name: Build and exercise optimized delivery bytes
        run: |
          set -euo pipefail
          cargo build --locked --profile release-github \
            -p brit-cli --bin brit --bin brit-rebase-retained \
            -p brit-build-ref --bin brit-build-ref -p brit-verify --bin brit-verify \
            --no-default-features --features brit-cli/max-pure
          mkdir cpu-candidate
          for name in brit brit-build-ref brit-verify brit-rebase-retained; do
            install -m 0755 "$CARGO_TARGET_DIR/release-github/$name" "cpu-candidate/$name"
          done
          cpu-candidate/brit --version | grep -Fx "source HEAD: $GITHUB_SHA"
          (cd cpu-candidate && sha256sum brit brit-build-ref brit-verify brit-rebase-retained > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > cpu-candidate/SOURCE_COMMIT
          test -z "$(git status --porcelain --untracked-files=no)"
          bash scripts/ci/verify-cpu-matrix.sh "$PWD/cpu-candidate/brit" \
            "$PWD/cpu-candidate/brit-build-ref" "$PWD/cpu-candidate/brit-verify" \
            "$PWD/cpu-candidate/brit-rebase-retained" | tee cpu-candidate/qualification.log
      - name: Retain CPU qualified candidate bytes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brit-cpu-candidate
          path: cpu-candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Retain failed CPU diagnostics separately
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brit-cpu-failed-diagnostics
          path: cpu-candidate/
          if-no-files-found: ignore
          retention-days: 1

  brit-rust-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the addressed standalone Rust checker
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/brit-rust-style-target
          RUSTFLAGS: ""
          RUSTC_WRAPPER: ""
          CARGO_BUILD_JOBS: "1"
        run: |
          rustup toolchain install 1.100.0 --profile minimal --no-self-update
          bash scripts/ci/install-rust-style.sh "$GITHUB_WORKSPACE/.eprfs/tools/rust-style"
      - name: Test Rust style adapter boundaries
        run: |
          bash scripts/ci/test-install-rust-style.sh
          bash scripts/ci/test-rust-style-ci.sh
          bash scripts/ci/test-rust-style.sh --native "$GITHUB_WORKSPACE/.eprfs/tools/rust-style/bin/epr-rust-style"
      - name: Check the committed Rust discipline trial
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/rust-style-ci.sh

  brit-feature-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read governed Git reference
        id: git-reference
        run: python3 -c 'import json,os; r=json.load(open("docs/parity/git-reference.json")); print("revision="+r["revision"], file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: git/git
          ref: ${{ steps.git-reference.outputs.revision }}
          path: vendor/git
          persist-credentials: false
      - name: Test census and boundary semantics
        run: env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s etc/parity -p 'test_*.py'
      - name: Verify pinned census freshness
        run: bash etc/parity/enumerate.sh --check
      - name: Install legacy ledger generator dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk
      - name: Verify legacy shortcomings freshness
        run: bash etc/parity/shortcomings.sh --check

  brit-readiness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate readiness evidence qualification
        run: env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci -p 'test_qualify_readiness.py'
      - name: Validate the inherited-CI contract against planned job shapes
        run: env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci -p 'test_inherited_ci_policy.py'
      - name: Validate bounded reach adapter with isolated evaluator fixtures
        run: |
          sh -n .githooks/pre-push
          bash -n scripts/ci/test-brit-reach-hook.sh
          bash scripts/ci/test-brit-reach-hook.sh

  brit-release-package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Brit archive helper and receipt
        run: |
          bash -n scripts/ci/package-brit-release.sh scripts/ci/test-package-brit-release.sh
          bash scripts/ci/test-package-brit-release.sh
          bash scripts/ci/test-followed-brit-artifacts.sh
      - name: Validate nonpublishing candidate delivery and release guards
        run: |
          bash -n scripts/ci/validate-brit-delivery-source.sh scripts/ci/test-brit-delivery-source.sh
          bash scripts/ci/test-brit-delivery-source.sh
      - name: Validate atomic Unix installation and rollback
        run: |
          bash -n scripts/ci/install-brit-release.sh scripts/ci/test-install-brit-release.sh scripts/ci/verify-installed-brit.sh scripts/ci/verify-brit-upgrade.sh
          bash scripts/ci/test-install-brit-release.sh
      - name: Validate pinned Brit and EPR pair installation with synthetic fixtures
        run: |
          bash -n scripts/ci/install-brit-epr.sh scripts/ci/test-install-brit-epr.sh
          bash scripts/ci/test-install-brit-epr.sh
      - name: Validate publisher closure checks against a fake registry
        run: env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci -p 'test_publish_brit.py'
      - name: Validate isolated registry-consumer checks without a registry
        run: env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci -p 'test_verify_brit_consumer.py'

  pure-rust-build:
    runs-on: ubuntu-latest

    container: debian:stable-slim

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prerequisites
        run: |
          prerequisites=(
            ca-certificates
            curl
            gcc  # rustc calls gcc to invoke the linker.
            libc-dev  # rustc, in the toolchain we are using, dynamically links to the system libc.
          )
          apt-get update
          apt-get install --no-install-recommends -y -- "${prerequisites[@]}"
        shell: bash # This step needs `bash`, and the default in container jobs is `sh`.
      - name: Verify that we are in an environment with limited dev tools
        run: |
          set -x
          for package in cmake g++ libssl-dev make pkgconf pkg-config; do
            if dpkg-query --status -- "$package"; then
              exit 1
            fi
          done
          for cmd in cmake g++ make pkgconf pkg-config; do
            if command -v -- "$cmd"; then
              exit 1
            fi
          done
      - name: Install Rust via Rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
      - name: Add Rust tools to path
        run: echo "PATH=$HOME/.cargo/bin:$PATH" >> "$GITHUB_ENV"
      - name: Generate dependency tree
        run: cargo tree --locked --no-default-features --features max-pure > tree.txt
      - name: Scan for dependencies that build C or C++ code
        run: |
          pattern='.*\b(-sys|cc|cmake|pkg-config|vcpkg)\b.*'
          ! GREP_COLORS='ms=30;48;5;214' grep --color=always -Ex -C 1000000 -e "$pattern" tree.txt
        continue-on-error: true
      - name: Check for unrecognized *-sys dependencies
        run: |
          ! grep -qP '(?<!\b(linux-raw|aws-lc|inotify|dirs))-sys\b' tree.txt
      - name: Wrap cc1 (and cc1plus if present) to record calls
        run: |
          set -o noclobber  # Catch any collisions with existing entries in /usr/local.

          # Define the wrapper script for a compiler driver (for cc1 or cc1plus). This wrapper
          # records calls, then delegates to the executable it wraps. When recording calls, writes
          # to the log are synchronized so fragments of separate log entries aren't interleaved,
          # even in concurrent runs. This wrapper knows what executable it is wrapping because,
          # when deployed, this wrapper (or a symlink) replaces that executable, which will itself
          # have been moved aside by being renamed with a `.orig` suffix, so this can call it. (The
          # lockfile name GUID is just to avoid unintentional collision with unrelated lockfiles.)
          cat >/usr/local/bin/wrapper1 <<'EOF'
          #!/bin/sh
          set -e
          printf '%s\n' "$0 $*" |
            flock /run/lock/wrapper1.fbd136bd-9b1b-448d-84a9-e18be53ae63c.lock \
            tee -a -- /var/log/wrapper1.log ~/display >/dev/null  # We'll link ~/display later.
          exec "$0.orig" "$@"
          EOF

          # Define the script that performs the wrapping. This script shall be run once for each
          # executable to be wrapped, renaming it with a `.orig` suffix and replacing it with a
          # symlink to the wrapper script, defined above.
          cat >/usr/local/bin/wrap1 <<'EOF'
          #!/bin/sh
          set -e
          dir="$(dirname -- "$1")"
          base="$(basename -- "$1")"
          cd -- "$dir"
          mv -- "$base" "$base.orig"
          ln -s -- /usr/local/bin/wrapper1 "$base"
          EOF

          # Define a helper file that, when sourced, wires up the `~/display` symlink `wrapper1`
          # uses to report calls as GitHub Actions step output (in addition to writing them to a
          # log file). This is needed because stdout and stderr are both redirected elsewhere when
          # the wrapper actually runs, and `/dev/tty` is not usable. This must be sourced in the
          # same step as the `cargo` command that causes wrapped executables to be run, because
          # different steps write to different pipe objects. (This also needs the shell that
          # sourced it to remain running. But that is not the cause of the underlying limitation.)
          cat >/usr/local/bin/set-display.sh <<'EOF'
          ln -s -- "/proc/$$/fd/1" ~/display
          EOF

          chmod +x /usr/local/bin/wrapper1 /usr/local/bin/wrap1
          mkdir /run/lock/wrapper1.fbd136bd-9b1b-448d-84a9-e18be53ae63c.lock

          find /usr/lib/gcc \( -name cc1 -o -name cc1plus \) \
            -print -exec /usr/local/bin/wrap1 {} \;
      - name: Build standalone CLI without C tools
        run: |
          . /usr/local/bin/set-display.sh
          cargo install --debug --locked --no-default-features --features max-pure \
            --path brit-cli --bin brit
      - name: Show logged C and C++ compilations (should be none)
        run: |
          ! cat /var/log/wrapper1.log
        continue-on-error: true

  test-journey:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal --no-self-update
          rustup default 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Run journey tests
        run: just ci-journey-tests
      - name: Prove shared trees through the public Brit executable
        run: |
          set -euo pipefail
          cargo build --locked -p brit-cli --bin brit --bin brit-rebase-retained
          cargo test --locked -p brit-bridge
          debug_dir="$(just dbg)"
          BRIT_BIN="$debug_dir/brit" BRIT_REBASE_RETAINED_BIN="$debug_dir/brit-rebase-retained" cargo test --locked -p cli-journey --test rebase --test shared_tree --test authoring --test commit_attribution --test pre_push --test explicit_leases --test commit_cleanup --test commit_amend --test commit_merge --test worktree_restore --test worktree_bounded --test switch --test pull --test broader_staging --test revision_ranges --test diff_name_only --test mutation_lock --test daily_driver --test native_authoring --test diff_stat --test context --test cli_surface
      - name: Prove push transport recovery on the shipped reqwest and the curl backends
        run: |
          set -euo pipefail
          debug_dir="$(just dbg)"
          # Shipped binaries are max-pure (reqwest); the journeys refuse to run in CI without it.
          cargo build --locked -p brit-cli --bin brit --no-default-features --features brit-cli/max-pure
          install -D -m 0755 "$debug_dir/brit" "$RUNNER_TEMP/brit-max-pure/brit"
          cargo build --locked -p brit-cli --bin brit
          BRIT_BIN="$debug_dir/brit" BRIT_REQWEST_BIN="$RUNNER_TEMP/brit-max-pure/brit" BRIT_REQWEST_REQUIRED=1 \
            cargo test --locked -p cli-journey --test push_transport
      - name: Check allocation-boundary output and state parity
        run: |
          set -euo pipefail
          debug_dir="$(just dbg)"
          # Functional coverage only. Whole-group enforcement is separately recorded by qualify-memory.sh.
          BRIT_BIN="$debug_dir/brit" cargo test --locked -p cli-journey --test memory --test memory_recovery --test memory_snapshot --test memory_diff_resources --test memory_object_store --test memory_merge_resources --test memory_replay --test memory_metadata --test memory_build --test memory_authoring_metadata --test memory_commit_metadata --test memory_commit_signatures --test memory_tix --test memory_credentials --test memory_editor --test memory_attributes_baseline --test memory_output -- --test-threads=1
      - name: Characterize stock Git rebase (design evidence, not Brit support)
        run: cargo test --locked -p cli-journey --test git_rebase_characterization
      - name: Prove internal conflict-aware authoring preservation
        run: cargo test --locked -p gitoxide-core --features blocking-client,gix/sha1,switch-test-faults --test conflict_authoring
      - name: Prove internal replay selection and preservation
        run: |
          cargo test --locked -p gitoxide-core --features blocking-client,gix/sha1,switch-test-faults --test replay --test replay_validation --test replay_retained --test replay_qualification --test replay_io
          cargo test --locked -p gitoxide-core --features blocking-client,gix/sha1 --lib repository::replay
      - name: Prove internal interactive sequencing and editor recovery
        run: |
          cargo test --locked -p gix-sequencer --features serde
          cargo test --locked -p gitoxide-core --features blocking-client,gix/sha1,switch-test-faults --test replay_interactive
      - name: Prove replay, switch and pull interruption with explicit recovery
        run: |
          set -euo pipefail
          cargo test --locked -p gitoxide-core --features blocking-client,gix/sha1 --lib power_loss
          cargo test --locked -p gitoxide-core --features blocking-client,gix/sha1,switch-test-faults --test replay_invocation
          cargo build --locked -p brit-cli --bin brit --bin brit-rebase-retained --features switch-test-faults
          debug_dir="$(just dbg)"
          BRIT_BIN="$debug_dir/brit" BRIT_REBASE_RETAINED_BIN="$debug_dir/brit-rebase-retained" cargo test --locked -p cli-journey --features switch-test-faults --test rebase --test switch --test pull --test commit_merge --test diff_stat
          cargo build --locked -p brit-cli --bin brit
      - name: Prove generic engine without protocol features
        run: cargo test --locked -p brit-epr --no-default-features
      - name: Measure legacy parity assertions (observation only)
        run: |
          set -euo pipefail
          debug_dir="$(just dbg)"
          output=.eprfs/status/parity/ci
          python3 etc/parity/run.py --brit "$debug_dir/brit" --ein "$debug_dir/ein" --jtt "$debug_dir/jtt" --git "$(command -v git)" --timeout 45 --output "$output/receipt.json"
          python3 etc/parity/reconcile.py --receipt "$output/receipt.json" > "$output/reconciliation.json"
          python3 etc/parity/reconcile.py --receipt "$output/receipt.json" --markdown > "$output/reconciliation.md"
          cat "$output/reconciliation.md"
      - name: Preserve parity observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brit-parity-observations
          path: .eprfs/status/parity/ci/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Run auxiliary Brit CLI journeys against built binaries
        run: |
          set -euo pipefail
          # Keep these as separate Cargo invocations: a combined build can
          # supply brit-verify's gix features through brit-build-ref.
          cargo build --locked -p brit-build-ref --bin brit-build-ref
          cargo build --locked -p brit-verify --bin brit-verify
          debug_dir="$(just dbg)"
          test -x "$debug_dir/brit-build-ref"
          test -x "$debug_dir/brit-verify"
          BRIT_BUILD_REF_BIN="$debug_dir/brit-build-ref" \
          BRIT_VERIFY_BIN="$debug_dir/brit-verify" \
            cargo test --locked -p cli-journey --test brit_build_ref --test brit_verify

  # Publishes the registry-eligible Brit crate closure to the internal Nexus
  # `elohim` cargo registry. Only runs on pushes to `main`, after `Tests pass`, which now
  # includes the inherited lint, feature and test jobs. It never gates a pull request, so
  # `.epr-meta/readiness.json` declares it deferred.
  publish:
    name: Publish brit crates to Nexus (elohim registry)

    needs: [tests-pass, brit-release-package-contract]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set an external Cargo target for publication checks
        run: printf 'CARGO_TARGET_DIR=%s/brit-publish-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal --no-self-update
          rustup default 1.100.0
      - name: Publish brit crates (idempotent, 409-safe)
        env:
          NEXUS_NPM_TOKEN: ${{ secrets.NEXUS_NPM_TOKEN }}
          # Clear the workflow-level (read-intent) token so cargo-publish-brit.sh
          # derives the write Bearer header from NEXUS_NPM_TOKEN (cargo-deployer).
          CARGO_REGISTRIES_ELOHIM_TOKEN: ""
        run: bash scripts/ci/cargo-publish-brit.sh
      - name: Verify a clean registry-only Brit consumer
        env:
          CARGO_REGISTRIES_ELOHIM_TOKEN: ${{ secrets.CARGO_REGISTRIES_ELOHIM_TOKEN }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("brit-cli/Cargo.toml", "rb"))["package"]["version"])')
          bash scripts/ci/verify-brit-consumer.sh "$version"

  # Stable name for the "all tests pass" requirement.
  tests-pass:
    name: Tests pass

    permissions: {}

    # Every job is listed here or declared deferred or disabled in `.epr-meta/readiness.json`;
    # `scripts/ci/test_qualify_readiness.py` refuses a job that is neither. Within `run`, the
    # same contract decides which planned jobs can fail this gate.
    needs:
      - plan
      - run
      - brit-rust-style
      - brit-cpu-compatibility
      - brit-release-package-contract
      - brit-readiness-contract
      - brit-feature-census
      - pure-rust-build
      - test-journey

    if: always() # Always run even if dependencies fail.

    runs-on: ubuntu-slim

    steps:
      - name: Show dependency results
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS"
      - name: Fail unless EVERY dependency succeeded
        if: always()
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ -z "$RESULTS" ]; then
            echo "no dependency results to judge"
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a dependency ended as '$result', not 'success'"
              exit 1
            fi
          done
      - name: Fail if ANY dependency failed, was cancelled, or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: OK
        run: exit 0
