lints.workspace = true

[package]
name = "gix-credentials"
version = "0.42.4"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project to interact with git credentials helpers"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.95"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false

[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde", "gix-sec/serde"]

[dependencies]
gix-sec = { version = "^0.16.2", path = "../gix-sec", registry = "elohim" }
gix-error = { version = "^0.5.3", path = "../gix-error", registry = "elohim", features = ["bstr"] }
gix-url = { version = "^0.40.4", path = "../gix-url", registry = "elohim" }
gix-path = { version = "^0.14.2", path = "../gix-path", registry = "elohim" }
gix-quote = { version = "^0.10.4", path = "../gix-quote", registry = "elohim" }
gix-command = { version = "^0.12.4", path = "../gix-command", registry = "elohim" }
gix-config-value = { version = "^0.21.4", path = "../gix-config-value", registry = "elohim" }
gix-prompt = { version = "^0.19.4", path = "../gix-prompt", registry = "elohim" }
gix-date = { version = "^0.19.0", path = "../gix-date", registry = "elohim" }
gix-trace = { version = "^0.3.2", path = "../gix-trace", registry = "elohim" }

serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
percent-encoding = "2.3.1"



document-features = { version = "0.2.1", optional = true }

[dev-dependencies]
insta = "1.46.3"
gix-sec = { path = "../gix-sec" }
gix-testtools = { path = "../tests/tools", features = ["sha1"] }

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]

[package.metadata.cargo-machete]
ignored = [
    # Public optional `serde` feature is retained for downstream feature compatibility.
    "serde",
]

[package.metadata.qa]
checks = [
    { args = ["--features", "serde"] },
]
