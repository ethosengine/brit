lints.workspace = true

[package]
name = "gix-glob"
version = "0.29.4"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing with pattern matching"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.95"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = true

[[bench]]
name = "wildmatch"
harness = false
path = "./benches/wildmatch.rs"

[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde", "bitflags/serde"]

[dependencies]
gix-trace = { version = "^0.3.2", path = "../gix-trace", registry = "elohim" }
gix-utils = { version = "^0.5.5", path = "../gix-utils", registry = "elohim" }
gix-path = { version = "^0.14.2", path = "../gix-path", registry = "elohim" }
gix-fs = { version = "^1.0.1", path = "../gix-fs", registry = "elohim", features = ["unstable"] }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
bitflags = "2"
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
criterion = "0.8.2"
gix-testtools = { path = "../tests/tools", features = ["sha1"] }

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]

[package.metadata.qa]
checks = [
    { args = ["--features", "serde"] },
]

[package.metadata.qa.wasm]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]
