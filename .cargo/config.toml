# .cargo/config.toml — consume the internal Nexus cargo registry.
#
# cargo-internal is a hosted repo that advertises auth-required:true, which the
# cargo client honors even though Nexus serves its content anonymously (and
# hosted cargo repos have no knob to disable it). So reads need a credential:
#   export CARGO_REGISTRIES_ELOHIM_TOKEN="Bearer <NpmToken>"
# A read-only token suffices; CI supplies one via the like-named secret.

# rakia (rakia-core / rakia-brit) is consumed from the `elohim` registry below —
# it is published to Nexus, so no local path override is needed or wanted here.
#
# Do NOT add a `paths = ["../rakia/..."]` override to this committed file: cargo
# ERRORS ("failed to update path override … No such file or directory") when an
# override directory is absent — it does NOT silently fall back to the registry.
# Standalone CI has no sibling rakia checkout, so a committed override breaks
# every cargo job. For local co-development of rakia + brit, add the override in
# a gitignored config (e.g. a parent-directory .cargo/config.toml) instead.

[registries.elohim]
index = "sparse+https://nexus.ethosengine.com/repository/cargo-internal/"

[source.crates-io]
replace-with = "elohim-mirror"

[source.elohim-mirror]
registry = "sparse+https://nexus.ethosengine.com/repository/cargo/"
