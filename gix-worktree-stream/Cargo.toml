lints.workspace = true

[package]
name = "gix-worktree-stream"
version = "0.39.1"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "generate a byte-stream from a git-tree"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.95"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-trace = { version = "^0.3.2", path = "../gix-trace", registry = "elohim" }
gix-utils = { version = "^0.5.5", path = "../gix-utils", registry = "elohim", features = ["io-pipe", "stream"] }
gix-hash = { version = "^0.28.4", path = "../gix-hash", registry = "elohim" }
gix-object = { version = "^0.66.4", path = "../gix-object", registry = "elohim", features = ["stream"] }
gix-attributes = { version = "^0.37.5", path = "../gix-attributes", registry = "elohim" }
gix-parallel = { version = "^0.50.2", path = "../gix-parallel", registry = "elohim", features = ["parallel"] }
gix-filter = { version = "^0.36.5", path = "../gix-filter", registry = "elohim" }
gix-traverse = { version = "^0.64.1", path = "../gix-traverse", registry = "elohim" }
gix-fs = { version = "^1.0.1", path = "../gix-fs", registry = "elohim", features = ["unstable"] }
gix-path = { version = "^0.14.2", path = "../gix-path", registry = "elohim" }

gix-error = { version = "^0.5.3", path = "../gix-error", registry = "elohim" }
parking_lot = "0.13.0"

[dev-dependencies]
insta = "1.46.3"
gix-worktree-stream = { path = ".", features = ["sha1", "sha256"] }
gix-testtools = { path = "../tests/tools" }
gix-hash = { path = "../gix-hash" }
gix-odb = { path = "../gix-odb" }
gix-worktree = { path = "../gix-worktree", default-features = false, features = ["attributes"] }

[package.metadata.docs.rs]
features = ["sha1"]

[package.metadata.cargo-machete]
# Enables thread-safe attribute and filter types passed to the stream's worker thread.
ignored = ["gix-parallel"]

[package.metadata.qa]
tests = [
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = ["--features", "sha256"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
