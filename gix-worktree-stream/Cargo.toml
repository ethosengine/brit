lints.workspace = true

[package]
name = "gix-worktree-stream"
version = "0.36.1"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "generate a byte-stream from a git-tree"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-features = { version = "^0.49.1", path = "../gix-features", registry = "elohim", features = ["progress", "io-pipe", "parallel"] }
gix-hash = { version = "^0.26.3", path = "../gix-hash", registry = "elohim" }
gix-object = { version = "^0.64.2", path = "../gix-object", registry = "elohim" }
gix-attributes = { version = "^0.35.0", path = "../gix-attributes", registry = "elohim", features = ["parallel"] }
gix-filter = { version = "^0.34.0", path = "../gix-filter", registry = "elohim" }
gix-traverse = { version = "^0.61.0", path = "../gix-traverse", registry = "elohim" }
gix-fs = { version = "^0.22.1", path = "../gix-fs", registry = "elohim" }
gix-path = { version = "^0.12.6", path = "../gix-path", registry = "elohim" }

gix-error = { version = "^0.3.2", path = "../gix-error", registry = "elohim" }
parking_lot = "0.12.4"

[dev-dependencies]
gix-worktree-stream = { path = ".", features = ["sha1", "sha256"] }
gix-testtools = { path = "../tests/tools" }
gix-hash = { path = "../gix-hash" }
gix-odb = { path = "../gix-odb" }
gix-worktree = { path = "../gix-worktree", default-features = false, features = ["attributes"] }

[package.metadata.docs.rs]
features = ["sha1"]
