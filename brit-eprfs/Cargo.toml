lints.workspace = true

[package]
name = "brit-eprfs"
version = "0.0.0"
description = "Brit adapter for projecting git trees into EPR filesystem manifests"
repository = "https://github.com/ethosengine/brit"
authors = ["Matthew Dowell <matthew@ethosengine.com>"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.82"
publish = ["elohim"]

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
bytes = "1"
eprfs-core = { version = "0.1", path = "../../eprfs/eprfs-core" }
gix = { version = "0.81", path = "../gix", default-features = false, features = ["basic", "sha1"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
eprfs-local = { version = "0.1", path = "../../eprfs/eprfs-local" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
