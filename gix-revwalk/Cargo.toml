lints.workspace = true

[package]
name = "gix-revwalk"
version = "0.37.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate providing utilities for walking the revision graph"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-hash = { version = "^0.28.0", path = "../gix-hash", registry = "elohim" }
gix-error = { version = "^0.5.1", path = "../gix-error", registry = "elohim" }
gix-object = { version = "^0.66.0", path = "../gix-object", registry = "elohim" }
gix-date = { version = "^0.18.0", path = "../gix-date", registry = "elohim" }
gix-hashtable = { version = "^0.18.0", path = "../gix-hashtable", registry = "elohim" }
gix-commitgraph = { version = "^0.41.0", path = "../gix-commitgraph", registry = "elohim" }

smallvec = "1.15.1"

[dev-dependencies]
gix-testtools = { path = "../tests/tools", default-features = false }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }

[package.metadata.docs.rs]
features = ["sha1"]
