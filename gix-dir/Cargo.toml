lints.workspace = true

[package]
name = "gix-dir"
version = "0.31.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing with directory walks"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false
test = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-index/sha1", "gix-worktree/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-index/sha256", "gix-worktree/sha256"]

[dependencies]
gix-error = { version = "^0.5.1", path = "../gix-error", registry = "elohim" }
gix-trace = { version = "^0.3.0", path = "../gix-trace", registry = "elohim" }
gix-index = { version = "^0.57.0", path = "../gix-index", registry = "elohim" }
gix-discover = { version = "^0.57.0", path = "../gix-discover", registry = "elohim" }
gix-fs = { version = "^0.24.0", path = "../gix-fs", registry = "elohim" }
gix-path = { version = "^0.14.0", path = "../gix-path", registry = "elohim" }
gix-pathspec = { version = "^0.22.0", path = "../gix-pathspec", registry = "elohim" }
gix-worktree = { version = "^0.58.0", path = "../gix-worktree", registry = "elohim", default-features = false }
gix-object = { version = "^0.66.0", path = "../gix-object", registry = "elohim" }
gix-ignore = { version = "^0.24.0", path = "../gix-ignore", registry = "elohim" }
gix-utils = { version = "^0.5.1", path = "../gix-utils", registry = "elohim", features = ["bstr"] }

bstr = { version = "1.12.0", default-features = false }

[dev-dependencies]
insta = "1.46.3"
gix-dir = { path = ".", features = ["sha1", "sha256"] }
gix-testtools = { path = "../tests/tools" }
gix-fs = { path = "../gix-fs" }
pretty_assertions = "1.4.0"

[package.metadata.docs.rs]
features = ["sha1"]
