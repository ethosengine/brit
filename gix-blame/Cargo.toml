lints.workspace = true

[package]
name = "gix-blame"
version = "0.17.1"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dedicated to implementing a 'blame' algorithm"
authors = ["Christoph Rüßler <christoph.ruessler@mailbox.org>", "Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-error = { version = "^0.3.2", path = "../gix-error", registry = "elohim" }
gix-commitgraph = { version = "^0.39.0", path = "../gix-commitgraph", registry = "elohim" }
gix-revwalk = { version = "^0.35.0", path = "../gix-revwalk", registry = "elohim" }
gix-trace = { version = "^0.1.21", path = "../gix-trace", registry = "elohim" }
gix-date = { version = "^0.16.0", path = "../gix-date", registry = "elohim" }
gix-diff = { version = "^0.67.2", path = "../gix-diff", registry = "elohim", default-features = false, features = ["blob"] }
gix-object = { version = "^0.64.2", path = "../gix-object", registry = "elohim" }
gix-hash = { version = "^0.26.3", path = "../gix-hash", registry = "elohim" }
gix-worktree = { version = "^0.56.0", path = "../gix-worktree", registry = "elohim", default-features = false, features = ["attributes"] }
gix-traverse = { version = "^0.61.0", path = "../gix-traverse", registry = "elohim" }

smallvec = "1.15.1"
thiserror = "2.0.18"

[dev-dependencies]
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }
gix-ref = { path = "../gix-ref", features = ["sha1", "sha256"] }
gix-filter = { path = "../gix-filter" }
gix-fs = { path = "../gix-fs" }
gix-index = { path = "../gix-index", features = ["sha1"] }
gix-odb = { path = "../gix-odb", features = ["sha1"] }
gix-testtools = { path = "../tests/tools" }
pretty_assertions = "1.4.0"

[package.metadata.docs.rs]
features = ["sha1"]
