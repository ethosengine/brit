lints.workspace = true

[package]
name = "gix-blame"
version = "0.20.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dedicated to implementing a 'blame' algorithm"
authors = ["Christoph Rüßler <christoph.ruessler@mailbox.org>", "Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.95"
include = ["/src/**/*", "/LICENSE-*"]

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-error = { version = "^0.5.3", path = "../gix-error", registry = "elohim" }
gix-utils = { version = "^0.5.4", path = "../gix-utils", registry = "elohim", features = ["stream"] }
gix-commitgraph = { version = "^0.42.0", path = "../gix-commitgraph", registry = "elohim" }
gix-revwalk = { version = "^0.38.0", path = "../gix-revwalk", registry = "elohim" }
gix-trace = { version = "^0.3.2", path = "../gix-trace", registry = "elohim" }
gix-date = { version = "^0.19.0", path = "../gix-date", registry = "elohim" }
gix-diff = { version = "^0.70.0", path = "../gix-diff", registry = "elohim", default-features = false, features = [
    "blob",
] }
gix-object = { version = "^0.66.3", path = "../gix-object", registry = "elohim" }
gix-hash = { version = "^0.28.3", path = "../gix-hash", registry = "elohim" }
gix-worktree = { version = "^0.59.0", path = "../gix-worktree", registry = "elohim", default-features = false, features = [
    "attributes",
] }
gix-traverse = { version = "^0.64.0", path = "../gix-traverse", registry = "elohim" }

smallvec = "1.15.1"

[dev-dependencies]
criterion = "0.8.2"
insta = "1.46.3"
gix-discover = { path = "../gix-discover", features = ["sha1", "sha256"] }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }
gix-ref = { path = "../gix-ref", features = ["sha1", "sha256"] }
gix-filter = { path = "../gix-filter" }
gix-fs = { path = "../gix-fs", features = ["unstable"] }
gix-index = { path = "../gix-index", features = ["sha1"] }
gix-odb = { path = "../gix-odb", features = ["sha1"] }
gix-testtools = { path = "../tests/tools" }
pretty_assertions = "1.4.0"

[[bench]]
name = "blame"
harness = false

[package.metadata.docs.rs]
features = ["sha1"]

[package.metadata.qa]
tests = [
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
