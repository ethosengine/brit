lints.workspace = true

[package]
name = "brit-graph"
version = "0.2.9"
description = "EPR-native graph engine — DAG construction, affected tracking, topological planning"
repository = "https://github.com/ethosengine/brit"
authors = ["Matthew Dowell <matthew@ethosengine.com>"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.100"

[lib]
doctest = false

[dependencies]
brit-epr = { version = "0.2.3", registry = "elohim", path = "../brit-epr", default-features = false }
# Step-glob meaning is globset's glob-to-regex translation; the pinned-regex
# unit test (step_glob_settings_pin_an_escaped_pattern) notices a change on upgrade.
globset = { version = "0.4.19", optional = true }
gix = { version = "^0.90.3", path = "../gix", registry = "elohim", default-features = false, features = ["basic", "blob-diff", "sha1", "sha256"], optional = true }
petgraph = "0.7"
# Decides whether a glob can match beneath a gitlink, on the regex globset compiles.
regex-automata = { version = "0.4", optional = true, default-features = false, features = ["std", "syntax", "nfa-thompson"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
default = []
repo = ["dep:gix", "dep:globset", "dep:regex-automata"]

[dev-dependencies]
tempfile = "3"
gix = { version = "^0.90.3", path = "../gix", registry = "elohim", default-features = false, features = ["basic", "blob-diff", "sha1", "sha256"] }
