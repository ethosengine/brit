lints.workspace = true

[package]
name = "gix-status"
version = "0.36.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing with 'git status'-like functionality"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>", "Pascal Kuthe <pascal.kuthe@semimod.de>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by enabling the respective feature in the `gix-hash` crate.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `gix-hash` crate.
sha256 = ["gix-hash/sha256"]
## Add support for tracking rewrites along with checking for worktree modifications.
worktree-rewrites = ["dep:gix-dir", "dep:gix-diff"]

[dependencies]
gix-trace = { version = "^0.3.0", path = "../gix-trace", registry = "elohim" }
gix-utils = { version = "^0.5.1", path = "../gix-utils", registry = "elohim", features = ["interrupt", "progress"] }
gix-parallel = { version = "^0.50.0", path = "../gix-parallel", registry = "elohim" }
gix-index = { version = "^0.57.0", path = "../gix-index", registry = "elohim" }
gix-fs = { version = "^0.24.0", path = "../gix-fs", registry = "elohim" }
gix-hash = { version = "^0.28.0", path = "../gix-hash", registry = "elohim" }
gix-error = { version = "^0.5.1", path = "../gix-error", registry = "elohim" }
gix-object = { version = "^0.66.0", path = "../gix-object", registry = "elohim" }
gix-path = { version = "^0.14.0", path = "../gix-path", registry = "elohim" }
gix-filter = { version = "^0.36.0", path = "../gix-filter", registry = "elohim" }
gix-worktree = { version = "^0.58.0", path = "../gix-worktree", registry = "elohim", default-features = false, features = ["attributes"] }
gix-pathspec = { version = "^0.22.0", path = "../gix-pathspec", registry = "elohim" }

gix-dir = { version = "^0.31.0", path = "../gix-dir", registry = "elohim", optional = true }
gix-diff = { version = "^0.69.0", path = "../gix-diff", registry = "elohim", default-features = false, features = ["blob"], optional = true }

filetime = "0.2.29"
bstr = { version = "1.12.0", default-features = false }

document-features = { version = "0.2.0", optional = true }

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = "1"

[target.'cfg(windows)'.dependencies]
hashbrown = "0.16.0"
windows-sys = { version = "0.61.1", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # Needed for `SECURITY_ATTRIBUTES` in the signature of `CreateFileW`,
    # which is gated behind this windows-sys feature even when the call passes null.
    "Win32_Security",
] }

[dev-dependencies]
insta = "1.46.3"
gix-status = { path = ".", features = ["worktree-rewrites", "sha1", "sha256"] }
gix-parallel = { path = "../gix-parallel", features = ["parallel"] }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }
gix-index = { path = "../gix-index" }
gix-fs = { path = "../gix-fs" }
gix-diff = { path = "../gix-diff" }
gix-filter = { path = "../gix-filter" }
gix-dir = { path = "../gix-dir" }
gix-odb = { path = "../gix-odb" }
gix-object = { path = "../gix-object" }
gix-pathspec = { path = "../gix-pathspec" }
gix-worktree = { path = "../gix-worktree" }
pretty_assertions = "1.4.0"

[package.metadata.docs.rs]
features = ["sha1", "document-features", "worktree-rewrites"]
