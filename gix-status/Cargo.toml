lints.workspace = true

[package]
name = "gix-status"
version = "0.37.1"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing with 'git status'-like functionality"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>", "Pascal Kuthe <pascal.kuthe@semimod.de>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.95"

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by enabling the respective feature in the `gix-hash` crate.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `gix-hash` crate.
sha256 = ["gix-hash/sha256"]
## Add support for tracking rewrites along with checking for worktree modifications.
worktree-rewrites = ["dep:gix-dir", "dep:gix-diff"]

[dependencies]
gix-trace = { version = "^0.3.2", path = "../gix-trace", registry = "elohim" }
gix-utils = { version = "^0.5.5", path = "../gix-utils", registry = "elohim", features = ["interrupt", "progress", "stream"] }
gix-parallel = { version = "^0.50.2", path = "../gix-parallel", registry = "elohim" }
gix-index = { version = "^0.58.1", path = "../gix-index", registry = "elohim" }
gix-fs = { version = "^1.0.1", path = "../gix-fs", registry = "elohim", features = ["unstable"] }
gix-hash = { version = "^0.28.4", path = "../gix-hash", registry = "elohim" }
gix-error = { version = "^0.5.3", path = "../gix-error", registry = "elohim" }
gix-object = { version = "^0.66.4", path = "../gix-object", registry = "elohim", features = ["stream"] }
gix-path = { version = "^0.14.2", path = "../gix-path", registry = "elohim" }
gix-filter = { version = "^0.36.5", path = "../gix-filter", registry = "elohim" }
gix-worktree = { version = "^0.59.1", path = "../gix-worktree", registry = "elohim", default-features = false, features = ["attributes"] }
gix-pathspec = { version = "^0.22.6", path = "../gix-pathspec", registry = "elohim" }

gix-dir = { version = "^0.32.1", path = "../gix-dir", registry = "elohim", optional = true }
gix-diff = { version = "^0.70.1", path = "../gix-diff", registry = "elohim", default-features = false, features = ["blob"], optional = true }

filetime = "0.2.29"
bstr = { version = "1.12.0", default-features = false }

document-features = { version = "0.2.0", optional = true }

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = "1"

[target.'cfg(windows)'.dependencies]
hashbrown = "0.17.1"

[dev-dependencies]
insta = "1.46.3"
gix-status = { path = ".", features = ["worktree-rewrites", "sha1", "sha256"] }
gix-parallel = { path = "../gix-parallel", features = ["parallel"] }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }
gix-index = { path = "../gix-index" }
gix-fs = { path = "../gix-fs", features = ["unstable"] }
gix-diff = { path = "../gix-diff" }
gix-filter = { path = "../gix-filter" }
gix-dir = { path = "../gix-dir" }
gix-odb = { path = "../gix-odb" }
gix-object = { path = "../gix-object" }
gix-pathspec = { path = "../gix-pathspec" }
gix-worktree = { path = "../gix-worktree" }
pretty_assertions = "1.4.0"

[package.metadata.docs.rs]
features = ["sha1", "document-features", "worktree-rewrites"]

[package.metadata.qa]
checks = [
    { args = ["--all-features"] },
]
tests = [
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
