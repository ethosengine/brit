lints.workspace = true

[package]
name = "gix-negotiate"
version = "0.38.1"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project implementing negotiation algorithms"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.95"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false
test = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-error = { version = "^0.5.3", path = "../gix-error", registry = "elohim" }
gix-hash = { version = "^0.28.4", path = "../gix-hash", registry = "elohim" }
gix-object = { version = "^0.66.4", path = "../gix-object", registry = "elohim" }
gix-date = { version = "^0.19.0", path = "../gix-date", registry = "elohim" }
gix-commitgraph = { version = "^0.42.1", path = "../gix-commitgraph", registry = "elohim" }
gix-revwalk = { version = "^0.38.1", path = "../gix-revwalk", registry = "elohim" }
bitflags = "2"

[dev-dependencies]
gix-testtools = { path = "../tests/tools" }
gix-odb = { path = "../gix-odb", features = ["sha1", "sha256"] }
gix-ref = { path = "../gix-ref", features = ["sha1", "sha256"] }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }

[package.metadata.docs.rs]
features = ["sha1"]

[package.metadata.qa]
tests = [
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = ["--features", "sha256"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
